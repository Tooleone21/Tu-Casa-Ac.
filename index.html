arencia" data-go="Transparencia">Transparencia</a></p><p>Prototipo académico · Institución ficticia · Ilustraciones originales · No se reciben donaciones ni mensajes reales.</p></footer><div id="toast" role="status" aria-live="polite"></div><script type="application/json" id="pages">{"Inicio": "<section class=\"hero\"><div class=\"hero-copy\"><span class=\"eyebrow\">JUNTOS HACEMOS LA DIFERENCIA<\/span><h1>Un hogar lleno de <em>oportunidades<\/em><\/h1><p>Tu apoyo puede ayudar a construir un entorno seguro, cercano y lleno de posibilidades para niñas, niños y adolescentes.<\/p><div class=\"actions\"><button data-go=\"Cómo ayudar\">♥ Donar mensualmente<\/button><button class=\"outline\" data-go=\"Nosotros\">Conoce nuestra labor<\/button><\/div><small>Propuesta académica para una asociación ficticia.<\/small><\/div><div class=\"hero-art\"><svg viewBox=\"0 0 560 430\" role=\"img\" aria-label=\"Ilustración de un hogar acogedor y corazones\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"280\" cy=\"215\" r=\"190\" fill=\"#f8e6d7\"/><circle cx=\"100\" cy=\"90\" r=\"27\" fill=\"#f2b78e\" opacity=\".7\"/><circle cx=\"465\" cy=\"330\" r=\"35\" fill=\"#d7e5d2\"/><path d=\"M115 211 280 77 445 211\" fill=\"none\" stroke=\"#b65f4c\" stroke-width=\"24\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"156\" y=\"205\" width=\"248\" height=\"177\" rx=\"16\" fill=\"#fffaf4\"/><rect x=\"252\" y=\"273\" width=\"65\" height=\"109\" rx=\"13\" fill=\"#b65f4c\"/><rect x=\"185\" y=\"242\" width=\"51\" height=\"57\" rx=\"9\" fill=\"#b9d8c3\"/><rect x=\"332\" y=\"242\" width=\"51\" height=\"57\" rx=\"9\" fill=\"#b9d8c3\"/><path d=\"M280 184c-32-40-76 4 0 54 76-50 32-94 0-54Z\" fill=\"#e9a081\"/><path d=\"M78 300c-15-22-40 1 0 31 40-30 15-53 0-31ZM460 120c-15-22-40 1 0 31 40-30 15-53 0-31Z\" fill=\"#c97a66\"/><\/svg><\/div><\/section><section class=\"section\"><div class=\"section-heading\"><span class=\"eyebrow\">DESCUBRE NUESTRA LABOR<\/span><h2>Hay muchas maneras de construir un futuro mejor<\/h2><\/div><div class=\"cards\"><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de manos colaborando en comunidad\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#e7eee2\"/><circle cx=\"260\" cy=\"143\" r=\"76\" fill=\"#fff7ec\"/><path d=\"M260 115c-31-42-82 7 0 69 82-62 31-111 0-69Z\" fill=\"#c56b53\"/><path d=\"M0 250c80-105 126-107 190-51l56 48-49 53H0Z\" fill=\"#dba78b\"/><path d=\"M520 250c-80-105-126-107-190-51l-56 48 49 53h197Z\" fill=\"#a6c2ad\"/><path d=\"M186 231c33-20 52-23 74-5 22-18 41-15 74 5\" fill=\"none\" stroke=\"#fff9ef\" stroke-width=\"16\" stroke-linecap=\"round\"/><\/svg><\/div><h3>Cómo ayudar<\/h3><p>Conoce las opciones de donación económica, en especie y voluntariado.<\/p><a class=\"text-link\" href=\"#Cómo ayudar\" data-go=\"Cómo ayudar\">Conoce las opciones →<\/a><\/article><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de útiles escolares donados\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#f6e6d9\"/><rect x=\"95\" y=\"94\" width=\"330\" height=\"155\" rx=\"20\" fill=\"#d69c79\"/><rect x=\"111\" y=\"106\" width=\"298\" height=\"125\" rx=\"14\" fill=\"#fff8ec\"/><rect x=\"142\" y=\"47\" width=\"76\" height=\"155\" rx=\"7\" transform=\"rotate(-10 142 47)\" fill=\"#9fbca7\"/><path d=\"M160 90h35m-35 20h35m-35 20h35\" stroke=\"white\" stroke-width=\"5\"/><rect x=\"255\" y=\"52\" width=\"64\" height=\"150\" rx=\"7\" transform=\"rotate(9 255 52)\" fill=\"#d4775d\"/><rect x=\"338\" y=\"60\" width=\"16\" height=\"141\" rx=\"7\" transform=\"rotate(15 338 60)\" fill=\"#e2b65f\"/><circle cx=\"386\" cy=\"155\" r=\"33\" fill=\"#e9c9b4\"/><path d=\"M386 145c-12-16-27 1 0 20 27-19 12-36 0-20Z\" fill=\"#c56c55\"/><\/svg><\/div><h3>Últimas noticias<\/h3><p>Consulta las actividades, necesidades y avances de nuestra comunidad.<\/p><a class=\"text-link\" href=\"#Noticias\" data-go=\"Noticias\">Leer noticias →<\/a><\/article><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de libros y aprendizaje\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#f3e4d7\"/><rect x=\"100\" y=\"160\" width=\"320\" height=\"43\" rx=\"9\" fill=\"#c36b55\"/><rect x=\"126\" y=\"119\" width=\"270\" height=\"40\" rx=\"9\" fill=\"#9ebba7\"/><rect x=\"150\" y=\"78\" width=\"235\" height=\"40\" rx=\"9\" fill=\"#e3b668\"/><path d=\"M169 93h170m-194 42h210m-230 41h260\" stroke=\"#fff8ed\" stroke-width=\"5\"/><path d=\"M117 210h292\" stroke=\"#765647\" stroke-width=\"9\" stroke-linecap=\"round\"/><circle cx=\"402\" cy=\"77\" r=\"27\" fill=\"#f7f2e7\"/><path d=\"M402 69c-12-16-27 1 0 20 27-19 12-36 0-20Z\" fill=\"#c36b55\"/><\/svg><\/div><h3>Transparencia<\/h3><p>Información institucional, rendición de cuentas y documentación.<\/p><a class=\"text-link\" href=\"#Transparencia\" data-go=\"Transparencia\">Consultar →<\/a><\/article><\/div><\/section><section class=\"banner\"><div><span class=\"eyebrow\">TU AYUDA IMPORTA<\/span><h2>El apoyo constante hace posibles grandes cambios.<\/h2><p>Explora las formas de contribuir, de manera única o recurrente.<\/p><\/div><button data-go=\"Cómo ayudar\">Quiero ayudar<\/button><\/section>", "Nosotros": "<section class=\"page-heading\"><span class=\"eyebrow\">NUESTRA ESENCIA<\/span><h1>Conócenos<\/h1><p>Una propuesta de sitio que comunica cuidado, respeto y oportunidades.<\/p><\/section><div class=\"split\"><div class=\"visual\"><svg viewBox=\"0 0 560 430\" role=\"img\" aria-label=\"Ilustración de un hogar acogedor y corazones\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"280\" cy=\"215\" r=\"190\" fill=\"#f8e6d7\"/><circle cx=\"100\" cy=\"90\" r=\"27\" fill=\"#f2b78e\" opacity=\".7\"/><circle cx=\"465\" cy=\"330\" r=\"35\" fill=\"#d7e5d2\"/><path d=\"M115 211 280 77 445 211\" fill=\"none\" stroke=\"#b65f4c\" stroke-width=\"24\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"156\" y=\"205\" width=\"248\" height=\"177\" rx=\"16\" fill=\"#fffaf4\"/><rect x=\"252\" y=\"273\" width=\"65\" height=\"109\" rx=\"13\" fill=\"#b65f4c\"/><rect x=\"185\" y=\"242\" width=\"51\" height=\"57\" rx=\"9\" fill=\"#b9d8c3\"/><rect x=\"332\" y=\"242\" width=\"51\" height=\"57\" rx=\"9\" fill=\"#b9d8c3\"/><path d=\"M280 184c-32-40-76 4 0 54 76-50 32-94 0-54Z\" fill=\"#e9a081\"/><path d=\"M78 300c-15-22-40 1 0 31 40-30 15-53 0-31ZM460 120c-15-22-40 1 0 31 40-30 15-53 0-31Z\" fill=\"#c97a66\"/><\/svg><\/div><div><h2>Un espacio para crecer<\/h2><p>Tu Casa A.C. es una casa hogar ficticia que brinda cuidado a niñas, niños y adolescentes. La información específica sobre su historia, personal y trayectoria deberá ser validada por la administración.<\/p><button data-go=\"Contacto\">Contáctanos<\/button><\/div><\/div><div class=\"cards\"><article class=\"card\"><h3>Misión<\/h3><p>Brindar cuidado, acompañamiento y oportunidades de desarrollo en un entorno protector.<\/p><\/article><article class=\"card\"><h3>Visión<\/h3><p>Promover un futuro con mayores posibilidades y vínculos de apoyo comunitario.<\/p><\/article><article class=\"card\"><h3>Valores<\/h3><p>Respeto, dignidad, solidaridad, empatía y transparencia.<\/p><\/article><\/div>", "Cómo ayudar": "<section class=\"page-heading\"><span class=\"eyebrow\">SUMA TU GRANITO DE ARENA<\/span><h1>Tu ayuda transforma vidas<\/h1><p>Elige cómo deseas contribuir. Todas las opciones de esta maqueta son demostrativas.<\/p><\/section><div class=\"cards\"><article class=\"card\"><div class=\"mini-icon\">♥<\/div><h3>Donación económica<\/h3><p>Apoya de forma recurrente o con una aportación única.<\/p><fieldset><legend>Modalidad<\/legend><label><input type=\"radio\" name=\"tipo\" checked> Mensual<\/label><label><input type=\"radio\" name=\"tipo\"> Única<\/label><\/fieldset><label for=\"monto\">Monto de ejemplo<\/label><select id=\"monto\"><option>$200 MXN<\/option><option>$500 MXN<\/option><option>$1,000 MXN<\/option><\/select><button id=\"fakeDonate\">Continuar (demo)<\/button><\/article><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de útiles escolares donados\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#f6e6d9\"/><rect x=\"95\" y=\"94\" width=\"330\" height=\"155\" rx=\"20\" fill=\"#d69c79\"/><rect x=\"111\" y=\"106\" width=\"298\" height=\"125\" rx=\"14\" fill=\"#fff8ec\"/><rect x=\"142\" y=\"47\" width=\"76\" height=\"155\" rx=\"7\" transform=\"rotate(-10 142 47)\" fill=\"#9fbca7\"/><path d=\"M160 90h35m-35 20h35m-35 20h35\" stroke=\"white\" stroke-width=\"5\"/><rect x=\"255\" y=\"52\" width=\"64\" height=\"150\" rx=\"7\" transform=\"rotate(9 255 52)\" fill=\"#d4775d\"/><rect x=\"338\" y=\"60\" width=\"16\" height=\"141\" rx=\"7\" transform=\"rotate(15 338 60)\" fill=\"#e2b65f\"/><circle cx=\"386\" cy=\"155\" r=\"33\" fill=\"#e9c9b4\"/><path d=\"M386 145c-12-16-27 1 0 20 27-19 12-36 0-20Z\" fill=\"#c56c55\"/><\/svg><\/div><h3>Donación en especie<\/h3><p>Material escolar, artículos de higiene y otros insumos según necesidades confirmadas.<\/p><a class=\"text-link\" href=\"#Contacto\" data-go=\"Contacto\">Preguntar qué se necesita →<\/a><\/article><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de manos colaborando en comunidad\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#e7eee2\"/><circle cx=\"260\" cy=\"143\" r=\"76\" fill=\"#fff7ec\"/><path d=\"M260 115c-31-42-82 7 0 69 82-62 31-111 0-69Z\" fill=\"#c56b53\"/><path d=\"M0 250c80-105 126-107 190-51l56 48-49 53H0Z\" fill=\"#dba78b\"/><path d=\"M520 250c-80-105-126-107-190-51l-56 48 49 53h197Z\" fill=\"#a6c2ad\"/><path d=\"M186 231c33-20 52-23 74-5 22-18 41-15 74 5\" fill=\"none\" stroke=\"#fff9ef\" stroke-width=\"16\" stroke-linecap=\"round\"/><\/svg><\/div><h3>Voluntariado<\/h3><p>Pregunta por las actividades disponibles, requisitos y procesos de participación.<\/p><a class=\"text-link\" href=\"#Contacto\" data-go=\"Contacto\">Quiero participar →<\/a><\/article><\/div><div class=\"banner\"><div><h2>Conoce nuestro proyecto solidario<\/h2><p>Una campaña ilustrativa para apoyar espacios de aprendizaje.<\/p><\/div><button data-go=\"Proyecto solidario\">Ver proyecto<\/button><\/div>", "Proyecto solidario": "<section class=\"page-heading\"><span class=\"eyebrow\">CAMPAÑA DE EJEMPLO<\/span><h1>Espacios para aprender<\/h1><p>Proyecto ilustrativo: metas, presupuesto y avances sujetos a confirmación.<\/p><\/section><div class=\"split\"><div class=\"visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de libros y aprendizaje\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#f3e4d7\"/><rect x=\"100\" y=\"160\" width=\"320\" height=\"43\" rx=\"9\" fill=\"#c36b55\"/><rect x=\"126\" y=\"119\" width=\"270\" height=\"40\" rx=\"9\" fill=\"#9ebba7\"/><rect x=\"150\" y=\"78\" width=\"235\" height=\"40\" rx=\"9\" fill=\"#e3b668\"/><path d=\"M169 93h170m-194 42h210m-230 41h260\" stroke=\"#fff8ed\" stroke-width=\"5\"/><path d=\"M117 210h292\" stroke=\"#765647\" stroke-width=\"9\" stroke-linecap=\"round\"/><circle cx=\"402\" cy=\"77\" r=\"27\" fill=\"#f7f2e7\"/><path d=\"M402 69c-12-16-27 1 0 20 27-19 12-36 0-20Z\" fill=\"#c36b55\"/><\/svg><\/div><div><h2>Aprender también es crecer<\/h2><p>La propuesta contempla materiales escolares y un entorno de estudio adecuado. La asociación deberá validar las necesidades reales antes de publicar esta campaña.<\/p><div class=\"progress\" aria-label=\"Avance pendiente de confirmar\"><span><\/span><\/div><small>Avance y meta económica pendientes de validar.<\/small><p><button data-go=\"Cómo ayudar\">Quiero contribuir<\/button><\/p><\/div><\/div><div class=\"cards\"><article class=\"card\"><h3>Objetivo<\/h3><p>Presentar de forma clara la necesidad que atiende la campaña.<\/p><\/article><article class=\"card\"><h3>Recursos<\/h3><p>Desglosar insumos, costos y destino previsto de las aportaciones.<\/p><\/article><article class=\"card\"><h3>Seguimiento<\/h3><p>Publicar actualizaciones verificables de los avances.<\/p><\/article><\/div>", "Noticias": "<section class=\"page-heading\"><span class=\"eyebrow\">NUESTRA COMUNIDAD<\/span><h1>Noticias y actividades<\/h1><p>Un espacio para compartir novedades, proyectos y necesidades de forma responsable.<\/p><\/section><div class=\"cards\"><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de útiles escolares donados\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#f6e6d9\"/><rect x=\"95\" y=\"94\" width=\"330\" height=\"155\" rx=\"20\" fill=\"#d69c79\"/><rect x=\"111\" y=\"106\" width=\"298\" height=\"125\" rx=\"14\" fill=\"#fff8ec\"/><rect x=\"142\" y=\"47\" width=\"76\" height=\"155\" rx=\"7\" transform=\"rotate(-10 142 47)\" fill=\"#9fbca7\"/><path d=\"M160 90h35m-35 20h35m-35 20h35\" stroke=\"white\" stroke-width=\"5\"/><rect x=\"255\" y=\"52\" width=\"64\" height=\"150\" rx=\"7\" transform=\"rotate(9 255 52)\" fill=\"#d4775d\"/><rect x=\"338\" y=\"60\" width=\"16\" height=\"141\" rx=\"7\" transform=\"rotate(15 338 60)\" fill=\"#e2b65f\"/><circle cx=\"386\" cy=\"155\" r=\"33\" fill=\"#e9c9b4\"/><path d=\"M386 145c-12-16-27 1 0 20 27-19 12-36 0-20Z\" fill=\"#c56c55\"/><\/svg><\/div><h3>Materiales para aprender<\/h3><p>Noticia de muestra sobre una posible campaña de útiles escolares. Fecha pendiente.<\/p><a class=\"text-link\" href=\"#Noticia individual\" data-go=\"Noticia individual\">Leer noticia →<\/a><\/article><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de manos colaborando en comunidad\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#e7eee2\"/><circle cx=\"260\" cy=\"143\" r=\"76\" fill=\"#fff7ec\"/><path d=\"M260 115c-31-42-82 7 0 69 82-62 31-111 0-69Z\" fill=\"#c56b53\"/><path d=\"M0 250c80-105 126-107 190-51l56 48-49 53H0Z\" fill=\"#dba78b\"/><path d=\"M520 250c-80-105-126-107-190-51l-56 48 49 53h197Z\" fill=\"#a6c2ad\"/><path d=\"M186 231c33-20 52-23 74-5 22-18 41-15 74 5\" fill=\"none\" stroke=\"#fff9ef\" stroke-width=\"16\" stroke-linecap=\"round\"/><\/svg><\/div><h3>Manos que ayudan<\/h3><p>Contenido demostrativo sobre participación comunitaria y voluntariado.<\/p><a class=\"text-link\" href=\"#Noticia individual\" data-go=\"Noticia individual\">Leer noticia →<\/a><\/article><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de libros y aprendizaje\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#f3e4d7\"/><rect x=\"100\" y=\"160\" width=\"320\" height=\"43\" rx=\"9\" fill=\"#c36b55\"/><rect x=\"126\" y=\"119\" width=\"270\" height=\"40\" rx=\"9\" fill=\"#9ebba7\"/><rect x=\"150\" y=\"78\" width=\"235\" height=\"40\" rx=\"9\" fill=\"#e3b668\"/><path d=\"M169 93h170m-194 42h210m-230 41h260\" stroke=\"#fff8ed\" stroke-width=\"5\"/><path d=\"M117 210h292\" stroke=\"#765647\" stroke-width=\"9\" stroke-linecap=\"round\"/><circle cx=\"402\" cy=\"77\" r=\"27\" fill=\"#f7f2e7\"/><path d=\"M402 69c-12-16-27 1 0 20 27-19 12-36 0-20Z\" fill=\"#c36b55\"/><\/svg><\/div><h3>Nuevos espacios<\/h3><p>Ejemplo de seguimiento a proyectos de mejora de instalaciones.<\/p><a class=\"text-link\" href=\"#Noticia individual\" data-go=\"Noticia individual\">Leer noticia →<\/a><\/article><\/div><div class=\"pagination\"><span>Página 1 de 1 · Noticias de demostración<\/span><button class=\"outline\" id=\"paginate\">Ver más noticias<\/button><\/div>", "Noticia individual": "<section class=\"page-heading\"><span class=\"eyebrow\">NOTICIAS / EJEMPLO<\/span><h1>Materiales para aprender<\/h1><p>Noticia ilustrativa · Fecha por confirmar<\/p><\/section><div class=\"article-detail\"><div class=\"visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de útiles escolares donados\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#f6e6d9\"/><rect x=\"95\" y=\"94\" width=\"330\" height=\"155\" rx=\"20\" fill=\"#d69c79\"/><rect x=\"111\" y=\"106\" width=\"298\" height=\"125\" rx=\"14\" fill=\"#fff8ec\"/><rect x=\"142\" y=\"47\" width=\"76\" height=\"155\" rx=\"7\" transform=\"rotate(-10 142 47)\" fill=\"#9fbca7\"/><path d=\"M160 90h35m-35 20h35m-35 20h35\" stroke=\"white\" stroke-width=\"5\"/><rect x=\"255\" y=\"52\" width=\"64\" height=\"150\" rx=\"7\" transform=\"rotate(9 255 52)\" fill=\"#d4775d\"/><rect x=\"338\" y=\"60\" width=\"16\" height=\"141\" rx=\"7\" transform=\"rotate(15 338 60)\" fill=\"#e2b65f\"/><circle cx=\"386\" cy=\"155\" r=\"33\" fill=\"#e9c9b4\"/><path d=\"M386 145c-12-16-27 1 0 20 27-19 12-36 0-20Z\" fill=\"#c56c55\"/><\/svg><\/div><p>Esta es una noticia de ejemplo para mostrar cómo se presentaría una actividad institucional: imagen, fecha, título, texto y enlaces relacionados.<\/p><p>Antes de publicar información real, Tu Casa A.C. deberá validar los datos y evitar identificar a menores o revelar información sensible.<\/p><div class=\"actions\"><button class=\"outline\" data-go=\"Noticias\">← Volver a noticias<\/button><button data-go=\"Cómo ayudar\">Conoce cómo ayudar<\/button><\/div><\/div>", "Transparencia": "<section class=\"page-heading\"><span class=\"eyebrow\">CONFIANZA Y CLARIDAD<\/span><h1>Transparencia<\/h1><p>La información institucional debe ser accesible, comprensible y mantenerse actualizada.<\/p><\/section><div class=\"cards\"><article class=\"card\"><h3>Informes anuales<\/h3><p>Espacio para publicar informes de actividades y resultados. Documentos por proporcionar.<\/p><\/article><article class=\"card\"><h3>Documentación institucional<\/h3><p>Apartado para datos y documentos legales que corresponda publicar, sujetos a revisión.<\/p><\/article><article class=\"card\"><h3>Preguntas frecuentes<\/h3><p>Respuestas sobre aportaciones, comprobantes y destino de recursos, por validar.<\/p><\/article><\/div><div class=\"notice\">Los archivos y datos legales son marcadores de posición; no se presentan documentos ficticios como si fueran oficiales.<\/div>", "Contacto": "<section class=\"page-heading\"><span class=\"eyebrow\">ESTAMOS PARA ESCUCHARTE<\/span><h1>Contáctanos<\/h1><p>¿Quieres donar, colaborar o saber más? Escríbenos.<\/p><\/section><div class=\"contact-grid\"><article class=\"card\"><h2>Envíanos un mensaje<\/h2><form id=\"contact\"><label for=\"nombre\">Nombre<\/label><input id=\"nombre\" required placeholder=\"Tu nombre\"><label for=\"correo\">Correo electrónico<\/label><input id=\"correo\" type=\"email\" required placeholder=\"tu@correo.com\"><label for=\"asunto\">Asunto<\/label><input id=\"asunto\" required placeholder=\"¿En qué podemos ayudarte?\"><label for=\"mensaje\">Mensaje<\/label><textarea id=\"mensaje\" required placeholder=\"Escribe aquí tu mensaje\"><\/textarea><label class=\"check\"><input type=\"checkbox\" required> He leído el <a href=\"#Aviso%20de%20privacidad\" data-go=\"Aviso de privacidad\">aviso de privacidad<\/a>.<\/label><button type=\"submit\">Enviar mensaje (demo)<\/button><p class=\"muted\">Este formulario no envía información real.<\/p><\/form><\/article><article class=\"card\"><div class=\"card-visual\"><svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Ilustración de manos colaborando en comunidad\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"520\" height=\"300\" rx=\"24\" fill=\"#e7eee2\"/><circle cx=\"260\" cy=\"143\" r=\"76\" fill=\"#fff7ec\"/><path d=\"M260 115c-31-42-82 7 0 69 82-62 31-111 0-69Z\" fill=\"#c56b53\"/><path d=\"M0 250c80-105 126-107 190-51l56 48-49 53H0Z\" fill=\"#dba78b\"/><path d=\"M520 250c-80-105-126-107-190-51l-56 48 49 53h197Z\" fill=\"#a6c2ad\"/><path d=\"M186 231c33-20 52-23 74-5 22-18 41-15 74 5\" fill=\"none\" stroke=\"#fff9ef\" stroke-width=\"16\" stroke-linecap=\"round\"/><\/svg><\/div><h2>Medios de atención<\/h2><p>Correo electrónico, teléfono, horarios y ubicación pública por confirmar con la administración.<\/p><p>Por seguridad, no se publicarán datos sensibles de los menores.<\/p><\/article><\/div>", "Aviso de privacidad": "<section class=\"page-heading\"><span class=\"eyebrow\">PROTECCIÓN DE DATOS<\/span><h1>Aviso de privacidad<\/h1><p>Información preliminar para revisión institucional y legal.<\/p><\/section><article class=\"card reading\"><h2>Tratamiento de datos personales<\/h2><p>El aviso definitivo deberá identificar al responsable del tratamiento, los datos que se recaban, sus finalidades y los mecanismos para ejercer derechos ARCO.<\/p><h2>Uso del formulario<\/h2><p>Esta maqueta es una simulación académica: no almacena ni transmite mensajes, donativos ni datos personales.<\/p><h2>Actualización<\/h2><p>El texto deberá ser sustituido por el aviso aprobado por la asociación antes de operar el sitio real.<\/p><\/article>"}</script><script>const pages=JSON.parse(document.getElementById('pages').textContent);function go(name){if(!pages[name])name='Inicio';document.getElementById('view').innerHTML=pages[name];document.title=name+' | Tu Casa A.C.';if(location.hash!==('#'+encodeURIComponent(name)))history.pushState(null,'','#'+encodeURIComponent(name));document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.go===name));window.scrollTo(0,0)}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',3500)}document.addEventListener('click',e=>{const x=e.target.closest('[data-go]');if(x){e.preventDefault();go(x.dataset.go)}if(e.target.id==='fakeDonate')toast('Demostración: no se procesan pagos.');if(e.target.id==='paginate')toast('Paginación de ejemplo: aún no hay más noticias.')});document.addEventListener('submit',e=>{if(e.target.id==='contact'){e.preventDefault();toast('Mensaje simulado. No se ha enviado ningún dato.');e.target.reset()}});window.addEventListener('hashchange',()=>go(decodeURIComponent(location.hash.slice(1))||'Inicio'));go(decodeURIComponent(location.hash.slice(1))||'Inicio');</script></body></html>
